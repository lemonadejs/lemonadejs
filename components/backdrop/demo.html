<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>LemonadeJS — Backdrop</title>
    <link rel="stylesheet" href="./src/style.css" />
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; max-width: 640px; }
        .demo h3 { margin-top: 28px; }
        pre { background: #f1f5f9; padding: 12px; border-radius: 6px; min-height: 20px; }
        button { margin-top: 8px; }
        /* Demo-only CSS spinner shown inside the backdrop */
        .demo-spinner {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            animation: demo-spin 0.8s linear infinite;
        }
        @keyframes demo-spin {
            to { transform: rotate(360deg); }
        }
        .demo-card {
            background: #fff;
            color: #18181b;
            padding: 20px 28px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body>
    <a href="/" style="display:inline-block;margin:0 0 18px;font-family:system-ui,sans-serif;font-size:13px;color:#71717a;text-decoration:none">&larr; All components</a>
    <div id="app"></div>
    <script src="/.dev/components/backdrop/demo.js"></script>
</body>
</html>
